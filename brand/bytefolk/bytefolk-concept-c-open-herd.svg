<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-label="ByteFolk open herd logo concept">
  <title>ByteFolk Logo Concept C — Open Herd</title>
  <desc>Four independent contributors assemble into an abstract hybrid animal and human face beside an open technical wordmark.</desc>
  <style>
    :root {
      --bf-blue: #1677ff;
      --bf-purple: #722ed1;
      --bf-ink: #141414;
      --bf-paper: #ffffff;
      --bf-line: #424242;
    }
    .wordmark {
      fill: var(--bf-ink);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 55px;
      font-weight: 700;
      letter-spacing: -3px;
    }
  </style>
  <g id="open-herd-mark" transform="translate(16 16)">
    <!-- Four contributors stay visibly separate while creating one face. -->
    <path fill="var(--bf-blue)" d="M12 28a8 8 0 0 1 8-8h28v36H12V28Zm8-20h12v14H20Z"/>
    <path fill="var(--bf-purple)" d="M56 20h31a9 9 0 0 1 9 9v27H56V20Zm28-12h12v18H84Z"/>
    <path fill="var(--bf-ink)" d="M12 64h36v44H28a16 16 0 0 1-16-16V64Z"/>
    <path fill="var(--bf-blue)" d="M56 64h40v10h18a14 14 0 0 1 14 14v6a14 14 0 0 1-14 14H56V64Z"/>
    <!-- Human-like shared attention and horse muzzle. -->
    <rect x="70" y="75" width="10" height="10" rx="3" fill="var(--bf-paper)"/>
    <rect x="99" y="84" width="7" height="10" rx="3" fill="var(--bf-paper)"/>
    <rect x="114" y="84" width="7" height="10" rx="3" fill="var(--bf-paper)"/>
    <!-- Open seams are the logo's community metaphor. -->
    <rect x="48" y="20" width="8" height="88" fill="var(--bf-paper)"/>
    <rect x="12" y="56" width="84" height="8" fill="var(--bf-paper)"/>
  </g>
  <text class="wordmark" x="174" y="101">ByteFolk</text>
</svg>
