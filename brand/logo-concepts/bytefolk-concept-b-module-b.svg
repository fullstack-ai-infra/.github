<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-label="ByteFolk modular B logo concept">
  <title>ByteFolk Logo Concept B — Module B</title>
  <desc>A compact B-shaped module mark with horn, eye, muzzle, and AI-core details beside the ByteFolk wordmark.</desc>
  <style>
    :root {
      --bf-blue: #1677ff;
      --bf-purple: #722ed1;
      --bf-ink: #141414;
      --bf-paper: #ffffff;
      --bf-line: #424242;
    }
    .wordmark {
      fill: var(--bf-ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-size: 64px;
      font-weight: 720;
      letter-spacing: -2.8px;
    }
  </style>
  <g id="module-b-mark" transform="translate(16 16)">
    <!-- A contained app-icon silhouette for GitHub and product navigation. -->
    <rect width="128" height="128" rx="24" fill="var(--bf-ink)"/>
    <!-- Two horn/connector modules. -->
    <path fill="var(--bf-blue)" d="M22 36V16h12v10h16v12H24a2 2 0 0 1-2-2Z"/>
    <path fill="var(--bf-blue)" d="M78 26h16V16h12v20a2 2 0 0 1-2 2H78Z"/>
    <!-- The vertical spine and two bowls form a geometric B. -->
    <rect x="26" y="42" width="18" height="70" rx="6" fill="var(--bf-paper)"/>
    <path fill="var(--bf-blue)" d="M48 42h31c16 0 25 8 25 20 0 8-4 14-11 17 9 3 14 9 14 17 0 10-8 16-20 16H48V96h32c6 0 9-3 9-8s-3-8-9-8H48V66h28c6 0 9-2 9-6s-3-6-9-6H48Z"/>
    <!-- Eye and AI core turn the monogram into a character. -->
    <rect x="56" y="50" width="12" height="12" rx="4" fill="var(--bf-ink)"/>
    <rect x="56" y="88" width="14" height="14" rx="4" fill="var(--bf-purple)"/>
    <rect x="74" y="88" width="8" height="14" rx="3" fill="var(--bf-paper)"/>
  </g>
  <text class="wordmark" x="174" y="103">ByteFolk</text>
</svg>
