<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-label="ByteFolk modular hybrid head logo concept">
  <title>ByteFolk Logo Concept A — Hybrid Head</title>
  <desc>An abstract cow, horse, and human head assembled from interoperable modules beside the ByteFolk wordmark.</desc>
  <style>
    :root {
      --bf-blue: #1677ff;
      --bf-purple: #722ed1;
      --bf-ink: #141414;
      --bf-paper: #f5f5f5;
      --bf-line: #424242;
    }
    .wordmark {
      fill: var(--bf-ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-size: 64px;
      font-weight: 760;
      letter-spacing: -3px;
    }
  </style>
  <g id="hybrid-head-mark" transform="translate(16 16)">
    <!-- Short cow horns become open-source connector brackets. -->
    <path fill="var(--bf-blue)" d="M22 28V8h12v14h15v12H28a6 6 0 0 1-6-6Z"/>
    <path fill="var(--bf-blue)" d="M78 22h15V8h12v20a6 6 0 0 1-6 6H78Z"/>
    <!-- Pixel-step mane. -->
    <path fill="var(--bf-purple)" d="M16 38h18v18H10V44a6 6 0 0 1 6-6Zm-6 24h24v18H10Zm0 24h24v18H16a6 6 0 0 1-6-6Z"/>
    <!-- Horse head and sturdy human-like neck reduce to one modular silhouette. -->
    <path fill="var(--bf-ink)" d="M34 28h51l19 18v18h12a12 12 0 0 1 12 12v22a12 12 0 0 1-12 12H88l-15 14H45a11 11 0 0 1-11-11V28Z"/>
    <rect x="46" y="42" width="18" height="18" rx="4" fill="var(--bf-blue)"/>
    <rect x="52" y="48" width="6" height="6" rx="2" fill="var(--bf-paper)"/>
    <!-- Muzzle block makes the horse readable at avatar scale. -->
    <rect x="82" y="68" width="46" height="32" rx="10" fill="var(--bf-paper)"/>
    <rect x="94" y="79" width="6" height="9" rx="3" fill="var(--bf-line)"/>
    <rect x="112" y="79" width="6" height="9" rx="3" fill="var(--bf-line)"/>
    <!-- Human/digital-employee node. -->
    <rect x="49" y="106" width="30" height="18" rx="5" fill="var(--bf-blue)"/>
    <rect x="58" y="109" width="12" height="12" rx="4" fill="var(--bf-paper)"/>
  </g>
  <text class="wordmark" x="174" y="103">ByteFolk</text>
</svg>
