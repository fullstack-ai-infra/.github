name: Maintenance task
description: Propose refactoring, tests, infrastructure, dependency, or repository maintenance
title: "[Maintenance] "
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched open and closed issues for duplicate work.
          required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What risk, cost, or limitation does this task address?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what is included and explicitly excluded.
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective, testable conditions for completion.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Describe the checks or review evidence that will prove completion.
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Affected component
      description: Name the repository area that owns this task.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Link blockers, dependent issues, rollout concerns, and rollback needs.
